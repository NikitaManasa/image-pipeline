name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (AWS mocked with moto)
        run: pytest -q
      - name: Build Lambda packages
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: build/*.zip
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: terraform init -backend=false -input=false && terraform validate
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Security scan (Checkov; skipped checks are justified in .checkov.yaml)
        working-directory: .
        run: pip install checkov==3.3.22 && checkov --config-file .checkov.yaml
